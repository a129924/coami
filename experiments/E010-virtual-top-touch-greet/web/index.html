<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coami E010 · 虛擬機頂打招呼</title>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">COAMI · EXPERIMENT E010</div>
        <h1>虛擬機頂輕觸打招呼</h1>
        <p>輕觸左、中、右任一區，模擬真實機頂的單次 touch-panel tap。</p>
      </header>
      <section class="workspace">
        <div class="simulator"><canvas id="viewport" aria-label="Coami 3D simulator"></canvas><canvas id="screen" width="320" height="240" hidden></canvas></div>
        <aside>
          <h2>虛擬機頂</h2>
          <div class="top-touch" aria-label="虛擬機頂三區">
            <button data-zone="left">左</button><button data-zone="center">中</button><button data-zone="right">右</button>
          </div>
          <dl><dt>Simulator</dt><dd id="simulator-status">載入中</dd><dt>MOD</dt><dd id="mod-status">等待啟動</dd><dt>機頂輸入</dt><dd id="touch-status">尚未觸發</dd><dt>動作</dt><dd id="run-status">尚未執行</dd></dl>
          <button id="restart">重新啟動模擬器</button>
          <h3>事件</h3><ol id="events" aria-live="polite"></ol>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
