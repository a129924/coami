<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coami E009 · 螢幕打招呼</title>
  </head>
  <body>
    <main>
      <header>
        <div class="eyebrow">COAMI · EXPERIMENT E009</div>
        <h1>螢幕點選打招呼</h1>
        <p>請直接點選模擬裝置螢幕內的「打招呼」。頁面右側僅顯示驗證紀錄。</p>
      </header>
      <section class="workspace">
        <div class="simulator"><canvas id="viewport" aria-label="Coami 3D simulator；請點選裝置螢幕"></canvas><canvas id="screen" width="320" height="240" hidden></canvas></div>
        <aside>
          <h2>驗證紀錄</h2>
          <dl><dt>Simulator</dt><dd id="simulator-status">載入中</dd><dt>MOD</dt><dd id="mod-status">等待啟動</dd><dt>觸碰</dt><dd id="touch-count">0</dd><dt>動作</dt><dd id="run-status">尚未執行</dd></dl>
          <p class="hint">以下按鈕只重新啟動模擬器，不會觸發打招呼。</p>
          <button id="restart">重新啟動模擬器</button>
          <h3>事件</h3><ol id="events" aria-live="polite"></ol>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
