[project]
name = "coami-e023-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "websockets==16.1.1"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "pyright==1.1.414"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["calculator.py", "app.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
