[project]
name = "coami-e027-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.141.1", "httpx==0.28.1", "uvicorn==0.53.0"]
[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8", "pyright==1.1.414"]
[tool.uv]
package = false
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
[tool.pyright]
include = ["app.py", "models.py", "contexts.py", "providers.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
