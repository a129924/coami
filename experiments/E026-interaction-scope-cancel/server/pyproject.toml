[project]
name = "coami-e026-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "bubus==1.5.6",
  "fastapi==0.141.1",
  "starlette==1.6.0",
  "anyio==4.15.1",
  "pydantic==2.13.5",
  "uvicorn==0.53.0",
  "websockets==15.0.1",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1", "ruff==0.16.8", "pyright==1.1.414"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_app.py"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["app.py", "../run_experiment.py"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
