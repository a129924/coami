[project]
name = "coami-e003-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "websockets>=14,<17",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
  "pyright>=1.1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_app.py"]

[tool.ruff]
target-version = "py312"

[tool.pyright]
include = ["app.py", "test_app.py"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
